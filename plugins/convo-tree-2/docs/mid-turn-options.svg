<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>convo-tree-2: two ways to switch mid-turn</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
    <style>
      .t { font-size: 13px; fill: #1f2328; }
      .b { font-size: 13px; fill: #1f2328; font-weight: 700; }
      .m { font-size: 12px; fill: #59636e; }
      .c { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1f2328; }
      .lane { font-size: 12px; fill: #59636e; font-weight: 600; letter-spacing: 0.04em; }
      .card { fill: #ffffff; stroke: #d0d7de; }
      .pro { font-size: 12px; fill: #1a7f37; }
      .con { font-size: 12px; fill: #cf222e; }
    </style>
  </defs>

  <rect width="960" height="620" rx="12" fill="#f6f8fa"/>
  <text x="32" y="42" class="b" font-size="16">Two ways to switch mid-turn</text>

  <!-- option 1 -->
  <rect x="32" y="64" width="896" height="236" rx="10" class="card"/>
  <text x="52" y="94" class="b">1 · Wait for A, then switch</text>
  <rect x="246" y="80" width="56" height="20" rx="10" fill="#dafbe1"/>
  <text x="274" y="94" class="m" text-anchor="middle" fill="#1a7f37">built</text>

  <text x="52" y="136" class="lane">YOU</text>
  <text x="52" y="186" class="lane">MAIN LOOP</text>
  <line x1="170" y1="132" x2="910" y2="132" stroke="#d0d7de"/>
  <circle cx="200" cy="132" r="6" fill="#0969da"/><text x="212" y="126" class="t">prompt on A</text>
  <circle cx="390" cy="132" r="6" fill="#8250df"/><text x="402" y="126" class="t">switch to B</text>
  <circle cx="520" cy="132" r="6" fill="#59636e"/><text x="532" y="126" class="t">prompt (queued)</text>

  <rect x="200" y="166" width="440" height="32" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="216" y="187" class="t">turn A finishes on A</text>
  <path d="M672,170 l12,12 l-12,12 l-12,-12 z" fill="#1a7f37"/>
  <text x="672" y="214" class="c" text-anchor="middle">install B</text>
  <rect x="700" y="166" width="208" height="32" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="716" y="187" class="t">turn B</text>

  <text x="52" y="250" class="pro">+ no extra requests; nothing is lost or redone</text>
  <text x="52" y="272" class="con">− you watch A's reply finish before you move to B</text>
  <text x="500" y="250" class="pro">+ uses only the install points that already work</text>

  <!-- option 2 -->
  <rect x="32" y="320" width="896" height="250" rx="10" class="card"/>
  <text x="52" y="350" class="b">2 · Hand A off to a background fork</text>
  <rect x="302" y="336" width="76" height="20" rx="10" fill="#fff8c5"/>
  <text x="340" y="350" class="m" text-anchor="middle" fill="#9a6700">explored</text>

  <text x="52" y="392" class="lane">MAIN LOOP</text>
  <text x="52" y="446" class="lane">FORK</text>
  <rect x="200" y="372" width="180" height="32" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="216" y="393" class="t">turn A</text>
  <text x="392" y="393" class="t" fill="#cf222e">✂</text>
  <text x="380" y="366" class="c" text-anchor="middle">$.turn.abort</text>
  <path d="M424,376 l12,12 l-12,12 l-12,-12 z" fill="#1a7f37"/>
  <text x="424" y="420" class="c" text-anchor="middle">install B</text>
  <rect x="452" y="372" width="456" height="32" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="468" y="393" class="t">turn B, right away</text>

  <line x1="380" y1="404" x2="380" y2="426" stroke="#8c959f" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <rect x="380" y="428" width="384" height="32" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-dasharray="4 3"/>
  <text x="396" y="449" class="c">$.agent.spawn({ subagentType: 'fork' })  finishes A</text>
  <line x1="764" y1="444" x2="790" y2="444" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="796" y="440" class="c">snapshot[A]</text>
  <text x="796" y="456" class="c">+= fork's messages</text>

  <text x="52" y="500" class="pro">+ you switch at once; A's reply waits on A</text>
  <text x="52" y="522" class="pro">+ the fork reads A's prefix from cache (0.05× input)</text>
  <text x="500" y="500" class="con">− redoes the step that was cut; a tool may stop halfway</text>
  <text x="500" y="522" class="con">− its completion notice may land in B's context</text>
  <text x="500" y="544" class="con">− shares the working folder and permission prompts with B</text>

  <text x="32" y="600" class="m">The fork is cheap in tokens; its cost is the extra moving parts. Option 1 is the default.</text>
</svg>
