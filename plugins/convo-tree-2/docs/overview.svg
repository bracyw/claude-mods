<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>convo-tree-2: what it does</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
    <style>
      .t { font-size: 13px; fill: #1f2328; }
      .b { font-size: 13px; fill: #1f2328; font-weight: 700; }
      .m { font-size: 12px; fill: #59636e; }
      .c { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .h { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .card { fill: #ffffff; stroke: #d0d7de; }
      .msg { font-size: 12px; text-anchor: middle; fill: #1f2328; }
    </style>
  </defs>

  <rect width="960" height="560" rx="12" fill="#f6f8fa"/>
  <text x="32" y="42" class="b" font-size="16">convo-tree-2 · what it does</text>
  <text x="32" y="64" class="m">Each branch is its own copy of the conversation. Switching swaps which copy Claude is working in.</text>

  <!-- tree -->
  <rect x="32" y="84" width="440" height="220" rx="10" class="card"/>
  <text x="52" y="112" class="h" fill="#59636e">BRANCHES</text>
  <rect x="56" y="166" width="132" height="56" rx="8" fill="#eaeef2" stroke="#afb8c1"/>
  <text x="122" y="190" class="b" text-anchor="middle">root</text>
  <text x="122" y="208" class="m" text-anchor="middle">turns 1–2</text>
  <path d="M188,194 C232,194 232,150 274,150" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M188,194 C232,194 232,240 274,240" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="278" y="122" width="150" height="56" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="300" y="146" class="b">A</text>
  <text x="300" y="164" class="m">turns 3–4</text>
  <rect x="278" y="212" width="150" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="300" y="236" class="b">B</text>
  <text x="300" y="254" class="m">turn 3</text>
  <rect x="366" y="224" width="48" height="20" rx="10" fill="#1a7f37"/>
  <text x="390" y="238" class="m" text-anchor="middle" style="fill:#ffffff">live</text>

  <!-- what claude sees -->
  <rect x="496" y="84" width="432" height="220" rx="10" class="card"/>
  <text x="516" y="112" class="h" fill="#59636e">WHAT CLAUDE SEES ON B</text>
  <rect x="516" y="140" width="88" height="34" rx="6" fill="#eaeef2" stroke="#afb8c1"/><text x="560" y="162" class="msg">turn 1</text>
  <rect x="612" y="140" width="88" height="34" rx="6" fill="#eaeef2" stroke="#afb8c1"/><text x="656" y="162" class="msg">turn 2</text>
  <rect x="708" y="140" width="88" height="34" rx="6" fill="#dafbe1" stroke="#4ac26b"/><text x="752" y="162" class="msg">B · turn 3</text>
  <rect x="516" y="206" width="88" height="34" rx="6" fill="none" stroke="#afb8c1" stroke-dasharray="4 3"/><text x="560" y="228" class="msg" style="fill:#8c959f">A · turn 3</text>
  <rect x="612" y="206" width="88" height="34" rx="6" fill="none" stroke="#afb8c1" stroke-dasharray="4 3"/><text x="656" y="228" class="msg" style="fill:#8c959f">A · turn 4</text>
  <text x="712" y="228" class="m">saved on A, not in context</text>
  <text x="516" y="276" class="m">Tool calls and their results move with the branch.</text>

  <!-- steps -->
  <text x="32" y="344" class="h" fill="#59636e">HOW YOU USE IT</text>

  <rect x="32" y="360" width="276" height="160" rx="10" class="card"/>
  <rect x="32" y="360" width="6" height="160" rx="3" fill="#0969da"/>
  <text x="56" y="390" class="b" fill="#0969da">1 · Branch</text>
  <text x="56" y="412" class="c">/branch · + Branch · ⑂ Split</text>
  <text x="56" y="446" class="t">Saves the conversation as it is.</text>
  <text x="56" y="468" class="t">Your next prompts grow the</text>
  <text x="56" y="490" class="t">new branch.</text>

  <rect x="342" y="360" width="276" height="160" rx="10" class="card"/>
  <rect x="342" y="360" width="6" height="160" rx="3" fill="#8250df"/>
  <text x="366" y="390" class="b" fill="#8250df">2 · Switch</text>
  <text x="366" y="412" class="c">/branch-to B · Switch here</text>
  <rect x="366" y="430" width="228" height="28" rx="6" fill="#fbefff" stroke="#c297ff"/>
  <text x="378" y="449" class="t">⑂ Next prompt goes to branch B</text>
  <text x="366" y="482" class="t">Mid-turn, it waits for the</text>
  <text x="366" y="504" class="t">reply to finish on its branch.</text>

  <rect x="652" y="360" width="276" height="160" rx="10" class="card"/>
  <rect x="652" y="360" width="6" height="160" rx="3" fill="#1a7f37"/>
  <text x="676" y="390" class="b" fill="#1a7f37">3 · Swap</text>
  <text x="676" y="412" class="c">before your next prompt</text>
  <text x="676" y="446" class="t">The branch you leave is saved.</text>
  <text x="676" y="468" class="t">The target's copy goes live.</text>
  <text x="676" y="490" class="t">Shared turns stay cached.</text>

  <line x1="310" y1="440" x2="338" y2="440" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="440" x2="648" y2="440" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
